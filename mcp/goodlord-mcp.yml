provider_signal: 'Goodlord publishes no MCP server and makes no public statement about one. No hosted
  or remote MCP endpoint, no npm package, no registry listing and no /.well-known/mcp surface was found
  on any Goodlord host. The tool list below is a CANDIDATE derived one-to-one from the operations that
  genuinely exist in Goodlord''s two published OpenAPI 3.1.0 documents — it is a design proposal for what
  an agent-facing Goodlord surface would expose, not a server that exists. Nothing here is invented: every
  source_operation is a verbatim operationId from a published spec.'
server:
  name: goodlord
  transport: http
  url: null
auth:
  note: Any real server would inherit Goodlord's partner-gated model — OAuth 2.0 client_credentials against
    /auth/token plus the issued Company-ID tenant header on every call for the Referencing API, and a
    JWT bearer for the Insurance App API. Credentials are issued by a Goodlord account manager, never
    self-serve, so an MCP deployment would be per-partner.
  detail: authentication/goodlord-authentication.yml
sensitivity_warning: This is among the most sensitive domains an agent could be pointed at. The Referencing
  API handles UK tenant identity documents, income and affordability data and credit-check outcomes; the
  Insurance App handles possession-proceedings and eviction records. Any real MCP deployment needs the
  execution contracts in agentic-access/goodlord-agentic-access.yml applied, human-in-the-loop on every
  write, and outcome-affecting operations (patchSubjectOutcomeConditions, api_insurance_claims_idsubmit_post)
  treated as consequential rather than routine.
