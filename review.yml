    wellKnownOpenidConfiguration: 'HTTP 200 — fetched anonymously from
      https://login.goodlord.co/7ddbafdc-ee33-46fb-968a-3011e2a0a825/B2C_1A_2_SIGNUPORSIGNIN/v2.0/.well-known/openid-configuration
      on 2026-07-26. Note this is the END-USER platform login for letting agents and
      tenants, NOT the developer API auth; the Referencing API uses its own
