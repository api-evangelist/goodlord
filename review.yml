findings:
  developerPortalIsRealButUncatalogued: |
    The single most important finding. Goodlord's real developer portal lives at
    portal.goodlord.co — a hostname that appears NOWHERE in the marketing site. The
    www.goodlord.com sitemap contains 385 URLs and not one /api, /developers or /docs
    entry; /api, /developers, /docs and /integrations on www.goodlord.com all return
    HTTP 404. The portal was found via web search, not by crawling the company's own
    site. A developer arriving at goodlord.co has no signposted route to it.
  wildcardDnsFalsePositiveTrap: |
    Ten subdomains of goodlord.co return HTTP 200 with byte-identical content
    (8,160 bytes, MD5 bc1447f277997272a0f21ee88571a5ee): developer, developers, docs,
    status, help, app, public-api, partner-api, integrations, webhooks and sandbox. A
    control probe of zzzznotreal.goodlord.co also returned 200. All are the Goodlord Core
    tenant SPA served by a wildcard record — the page title is "goodlord" and the only
    visible text is "Copy to Clipboard". There is consequently NO public status page and
    NO public help centre on goodlord.co, despite both hostnames answering 200.
  publiclyServedOpenapiOutsideThePortal: |
    insurance-app.goodlord.co is an API Platform (Symfony) service that serves its
    complete OpenAPI 3.1.0 document publicly and unauthenticated. GET /api/v1 returns a
    resourceNameCollection listing the internal DTO/model class names
    (App\InsuranceClaim\Domain\Dto\*, App\RentSchedule\Domain\Model\*, App\User\Domain\*,
    App\Company\*, App\File\*, App\Payment\*), and GET /api/v1/docs returns the full
    187,522-byte spec with 21 paths and 96 schemas. The same document is reachable at
    /api/v1/docs.jsonopenapi and /api/v1/docs?format=json. Content negotiation is strict:
    Accept: application/json returns HTTP 406 and only application/vnd.openapi+json is
    accepted. Every data operation is gated — /api/v1/companies and
    /api/v1/insurance_claims both returned HTTP 401 with an RFC-style error body. The
    spec's servers block also discloses Goodlord's non-production hostnames verbatim
    (insurance-app.staging.goodoverlord.com, insurance-app.qa1.goodoverlord.com,
    insurance-app.demo.goodlord.co) and mislabels the production host
    insurance-app.goodlord.co as "Development".
  liveServerIsOnADifferentDomain: |
    The live Referencing API's declared server is https://api.goodoverlord.com, not a
    goodlord.co host. goodoverlord.com is Goodlord's internal/engineering domain (it also
    carries the staging and QA hosts named in the Insurance App spec). That host did not
    answer anonymous probes at all (connection failure, curl code 000) — consistent with
    network-level allow-listing for partners. The sandbox host api-sandbox.goodlord.co IS
    publicly reachable: / returned HTTP 404 with a 9-byte text/plain body and
    /referencing/application returned HTTP 403 with a JSON body, confirming a live,
    credential-gated gateway rather than a dead name.
  webhooksExistAndAreDocumented: |
    Genuinely documented, which is rare in this sector. Three events are published with
    their exact event.name values — V2.subject.report.generated (final report generated),
    V2.subject.reference.form.generated (reference form generated) and
    V2.subject.outcome.updated (an outcome section changes status) — together with a
    literal example payload showing the referer, context.source (name "vouch", version
    "2"), context.event (name, version, timestamp) and data (customerId, applicationId,
    subjectId, type) envelope. There is no webhook management API and no self-serve
    subscription UI: Goodlord configures endpoints and event selection on request. No
    AsyncAPI document is published — the portal loads the AsyncAPI React component
    stylesheet as generic Tyk portal furniture, but no AsyncAPI artifact is served.
  documentationDepth: |
    Well beyond a bare reference. The Referencing Product page publishes a Getting
    Started guide, a Glossary, an Authentication walkthrough with working curl examples,
    the Webhooks catalogue, an API Specification section, and topic guides for Guarantor
    Collection, Guarantor-only referencing, API Outcomes, "Conditional Pass and
    Conditions Met: Explained", Touchpoints overview, Touchpoints vs. Milestones, Emails
    and Document Types. The domain model is explained in prose: Applications contain
    Subjects (Applicant, Guarantor, Employer, Accountant, Landlord referees), Rental
    Details carry Price Share and Affordability Ratio (recommended 2.5 for applicants,
    3 for guarantors), and Products are tiered Essential / Pro / Priority.
  sdks: |
    None. No first-party SDK in any language was found. An npm registry search for
    "goodlord" returned exactly one package and it is unrelated (helix-js, a front-end
    framework by an individual publisher). No GitHub organisation named goodlord or
    goodlord-uk exists (api.github.com/orgs/goodlord returned HTTP 404;
    github.com/GoodlordUK returned HTTP 404). github.com/goodlord returned HTTP 200 but
    was not verified as the company.
  postman: none found
  asyncapi: none found
  graphql: none found
  mcp: none found
  llmsTxt: 'HTTP 404 at https://www.goodlord.com/llms.txt'
  securityTxt: 'HTTP 404 at https://www.goodlord.com/.well-known/security.txt'
  statusPage: 'none — status.goodlord.co is the wildcard SPA, not a status page'
  rateLimits: none published
  productApiFamily: |
    Published and machine-readable (the two Referencing OpenAPIs, 10 paths each):
      - Authentication: POST /auth/token
      - Applications: POST /referencing/application;
        GET|PATCH|DELETE /referencing/application/{applicationId}
      - Subjects: PUT /referencing/subject/application/{applicationId};
        GET|PATCH|DELETE /referencing/subject/{subjectId};
        GET|POST /referencing/subject/{subjectId}/auth/token
      - Outcomes: PATCH /referencing/subject/{subjectId}/outcome/conditions
      - Touchpoints: GET /referencing/subject/{subjectId}/touchpoints
      - Emails: GET /referencing/subject/{subjectId}/emails
      - Media: GET /referencing/media/document/{documentId}
    Published and machine-readable (Insurance App OpenAPI, 21 paths, tags Company, File,
    InsuranceClaim, Payment, RentSchedule, RentScheduleRow, RentScheduleRowUpdate,
    RentScheduleRowPostDto, Agent, Role, RoleGroup):
      - Claims: GET|POST /api/v1/insurance_claims; GET|PATCH /api/v1/insurance_claims/{id};
        POST /api/v1/insurance_claims/{id}/submit
      - Claim files: GET|POST .../files; GET|DELETE .../files/{id}
      - Claim payments: GET .../payments; GET .../payments/{id}
      - Rent schedules: GET .../rent_schedule; POST .../rent_schedule_row;
        GET|PATCH|DELETE .../rent_schedule_row/{id}; POST .../rent_schedule_rows;
        POST .../rent_schedule/{rentScheduleId}/submit
      - Identity and org: GET /api/v1/me; GET|POST /api/v1/agents;
        GET|PATCH /api/v1/agents/{id}; GET /api/v1/companies; GET /api/v1/companies/{id};
        GET|POST|PATCH|DELETE /api/v1/roles and /api/v1/role_groups
    Marketed but with NO published contract (product surface only, taken verbatim from
    www.goodlord.com navigation): Core Platform, Tenant Referencing, Rent Protection
    Insurance, Tenant Payments, Goodlord Guarantor, PEPs & Sanction Checks, Contracts,
    Utility Management, CRM Integrations, Tenancy Progression, Tenancy Management,
    End of Tenancy, Property Protection, Buildings & Contents Insurance, Landlord Hub,
    Build to Rent, Tenant Support, Contents and Liability Insurance, Broadband and Media.
  valueChainPosition: |
    Goodlord is a tenancy-lifecycle platform, not a listings platform, which is why the
    UK portal duopoly never appears in its surface. Rightmove and Zoopla are mentioned
    nowhere on its integrations or partners pages. Its named integration partners are
    the CRM layer above it and the regulated/utility layer below it:
      - CRM / PMS: Reapit, Street.co.uk, Alto, Qube
      - Deposit schemes: The Tenancy Deposit Scheme (insured and custodial), The Deposit
        Protection Service (custodial), mydeposits; plus deposit alternative Reposit
      - Insurance: Paymentshield
      - Utilities / media: Home Telecom, OVO Energy, Sky UK, Perse (energy and carbon data)
      - Compliance / end of tenancy: Kamma (property licensing), The Depositary
    None of these are described as developer integrations; the integrations pages contain
    zero occurrences of the word "API" and describe commercial partnerships activated by
    Goodlord during customer onboarding ("during onboarding we work with you to
    understand who your other suppliers are, and if we're connected with them we can make
    sure the integrations are activated").

