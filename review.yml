      custom policy
    tenantId: 7ddbafdc-ee33-46fb-968a-3011e2a0a825
    policy: B2C_1A_2_SIGNUPORSIGNIN (sign-up-only variant B2C_1A_2_SIGNUPONLY)
    issuer: https://login.goodlord.co/7ddbafdc-ee33-46fb-968a-3011e2a0a825/v2.0/
    authorizationEndpoint: https://login.goodlord.co/7ddbafdc-ee33-46fb-968a-3011e2a0a825/b2c_1a_2_signuporsignin/oauth2/v2.0/authorize
    tokenEndpoint: https://login.goodlord.co/7ddbafdc-ee33-46fb-968a-3011e2a0a825/b2c_1a_2_signuporsignin/oauth2/v2.0/token
    jwksUri: https://login.goodlord.co/7ddbafdc-ee33-46fb-968a-3011e2a0a825/b2c_1a_2_signuporsignin/discovery/v2.0/keys
    scopesSupported:
    - openid
    idTokenSigningAlgs:
    - RS256
    subjectTypes:
    - pairwise
    customClaims:
    - companies
    - userRoles
    - userTypes
    - currentUserIdentities
    resourceScopePrefix: https://vouchauth.onmicrosoft.com/gl-api (declared in the Goodlord
      Core SPA msalConfig; the "vouchauth" tenant name reflects Goodlord's Vouch
