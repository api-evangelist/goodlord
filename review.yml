aid: goodlord
name: Goodlord
review:
  question: Does Goodlord publish a reachable public developer surface, and what is its
    RESO posture?
  answer: true
  date: '2026-07-26'
  reviewer: API Evangelist
  homeMarket: United Kingdom
  tier: property-management
  legalEntity: Oh Goodlord Limited (company number 8933499, VAT 274970368), The Hickman,
    2-4 Whitechapel Rd, London E1 1EW. Appointed Representative of Goodlord Protect
    Limited, authorised and regulated by the Financial Conduct Authority for insurance
    distribution activities, Firm Reference Number 836727 (taken verbatim from the
    www.goodlord.com footer, 2026-07-26).
  summary: |
    Goodlord is a UK lettings platform for residential letting agents, landlords and
    tenants, covering referencing, contracts, tenant payments, deposits, rent protection
    insurance, guarantors, PEPs/sanctions checks, inventories, utilities and end of
    tenancy. It sits between the agency CRM and the regulated deposit schemes, insurers
    and utility suppliers — deliberately NOT on the listings side of the UK market, which
    is controlled by the Rightmove/Zoopla portal duopoly.

    Goodlord DOES publish a real, reachable public developer portal — the strongest
    developer surface found so far in the UK lettings CRM/platform tier. It is a Tyk
    Developer Portal at https://portal.goodlord.co with a Public Catalogue containing one
    product (Referencing Product) exposing two APIs (Sandbox Referencing API and Live
    Referencing API). Documentation, authentication instructions, webhook event
    catalogue, glossary and the OpenAPI documents themselves are all readable and
    downloadable ANONYMOUSLY — no login required. Three genuine OpenAPI 3.1.0 documents
    were fetched and saved verbatim into openapi/.

    But the contract being public is not the same as the API being open. The portal's own
    registration page renders the message "Registration is not allowed" and requires an
    invite code, and Goodlord's own getting-started guide routes developers through a
    sales manager for sandbox and an account manager for production. Public docs,
    partner-gated keys.

    A separate, second API surface was found outside the developer portal: the Goodlord
    Insurance App at insurance-app.goodlord.co serves a complete OpenAPI 3.1.0 document
    publicly and unauthenticated at /api/v1/docs with the application/vnd.openapi+json
    media type. It is a rent-protection insurance claims API. It is not catalogued, not
    documented in prose, and has no onboarding path — the contract is public, the API is
    not offered.

    A significant false positive was avoided. developer.goodlord.co, developers.goodlord.co,
    docs.goodlord.co, status.goodlord.co, help.goodlord.co, public-api.goodlord.co,
    partner-api.goodlord.co, integrations.goodlord.co, webhooks.goodlord.co and
    sandbox.goodlord.co ALL return HTTP 200 — and all return the identical 8,160-byte
    document (MD5 bc1447f277997272a0f21ee88571a5ee), which is the Goodlord Core tenant
    SPA served by a wildcard DNS record. A nonsense subdomain returns the same page.
    None of them is a developer portal, a docs site, a status page or a help centre.
    Recording any of those 200s as a developer surface would have been wrong. The real
    portal is on a hostname that never appears in the marketing site's 385-URL sitemap:
    portal.goodlord.co.

resoPosture:
  certified: false
  posture: No RESO reference found — RESO is a US NAR/MLS construct with no United
    Kingdom counterpart
  webApiCertification: none
  dataDictionaryCertification: none
  dataDictionaryVersion: null
  resoDirectoryListing: none found
  upiSupport: false
  odataMetadataDocument: not served
  evidence: |
    Goodlord makes no RESO claim of any kind. A word-boundary search for "RESO",
    "Real Estate Standards", "Data Dictionary", "Universal Property Identifier", "UPI",
    "OData" and "$metadata" across every Goodlord artifact fetched on 2026-07-26 —
    the marketing site, the integrations and partners pages, the developer portal home,
    the product catalogue, the Referencing Product documentation page, both Referencing
    API OpenAPI documents, the Insurance App OpenAPI document, and the OIDC discovery
    document — returned ZERO hits. (An early loose grep matched "Reposit", a deposit
    alternative partner whose name merely contains the substring "reso"; that is not a
    RESO reference.) No RESO certification-directory listing for Goodlord was found.

    OData was ruled out by probe, not by inference. $metadata returned HTTP 404 at
    api-sandbox.goodlord.co, core-api.goodlord.co, insurance-app.goodlord.co and
    insurance-app.goodlord.co/api/v1, and connection failed at api.goodoverlord.com.
    www.goodlord.com/$metadata returned HTTP 404 and portal.goodlord.co/$metadata
    returned the portal's soft-404 HTML page (HTTP 200, 5,280 bytes, identical to
    /robots.txt and every other unknown path on that host — a Tyk portal catch-all, not
    a metadata document). Both published contract families are plain JSON REST described
    by OpenAPI 3.1.0, not OData.

    This absence is the expected and honest answer for the United Kingdom. The UK has no
    MLS and no cooperative listing database, so no industry body mandates a
    machine-readable listing contract the way NAR mandates RESO in the US. Goodlord in
    particular is not a listings company at all — it never touches the portal feed. Its
    contracts are tenancy-lifecycle contracts (applications, subjects, referencing
    outcomes, claims, rent schedules), a domain RESO's Data Dictionary does not model.
    The UK substitute for a standard here is not a standard: it is a set of bilateral
    commercial integrations with CRMs (Reapit, Alto, Street, Qube) and with the
    government-approved deposit schemes (TDS, DPS, mydeposits).

accessGate:
  gate: partner-only
  gated: true
  selfServe: false
  documentationPublic: true
  specsPublic: true
  whatADeveloperMustSignOrJoin: |
    A developer can READ everything and DOWNLOAD every contract with no account. What a
    developer cannot do is get a key.

    The Tyk portal's account creation page at
    https://portal.goodlord.co/auth/password/register returns HTTP 200 and renders the
    heading "Create an account" immediately followed by the message "Registration is not
    allowed". The form still exposes an "Invite code" field (form field invite_id)
    alongside email, first, last, password1 and password2 — i.e. the only path into the
    portal is an invite issued by Goodlord. There is no public application form, no
    "request access" flow, and no reviewed-then-approved queue.

    Goodlord's own published getting-started guide states the route in plain language:
    "If you have already spoken to Goodlord, good to see you again! ... Our teams will be
    working together to get you set up with your sandbox account. You should already have
    access. If you do not, please contact your sales manager. Ready to go-live? Simply
    contact your account manager, and we'll enable your full access to production and let
    you know when it's ready." Developers who have not yet spoken to Goodlord are directed
    to "Get in touch today to set up a call."

    Classified partner-only rather than application-approval because there is nothing to
    apply to — access is negotiated commercially through sales and enabled per account by
    Goodlord staff, and the self-serve registration route is explicitly disabled. There is
    no MLS membership requirement, no IDX/VOW data licence, and no requirement to be a
    licensed agent or broker-sponsored: the gate is a commercial relationship with the
    vendor. Webhook subscriptions are gated the same way — Goodlord's documentation says
    "Please contact us if you would like to subscribe to webhook events. When requesting
    access to an account, you must let us know which events you wish to subscribe to and
    what endpoints you would like us to call."
  portalConfirmed: true
  portalURL: https://portal.goodlord.co/
  portalNote: |
    Confirmed as a REAL developer portal, not a member login. https://portal.goodlord.co/
    returned HTTP 200 with the title "Welcome to the Goodlord Developer Portal" and the
    body text "Here you can find all the tools and resources you need to build your
    integration with the Goodlord API." It is a Tyk Developer Portal (footer: "Powered by
    © Tyk Technologies") rendering OpenAPI through Stoplight Elements. The product
    catalogue, the full Referencing Product documentation, the getting-started blog posts
    and both OpenAPI JSON documents were all retrieved anonymously with no cookie or
    credential. Only /portal/catalogue-apis, /portal/private, /portal/login and the
    subscription surfaces redirect to the Tyk login page.

openData:
  publishesOpenData: false
  note: |
    Goodlord publishes no open, unlicensed, publicly callable dataset. Every API found is
    tenant-scoped, credential-gated commercial SaaS data belonging to Goodlord's letting
    agency customers, and the domain is personal data of the highest sensitivity —
    identity documents, credit checks, income and affordability, address history.
    A word-boundary search for "Land Registry", "Ordnance Survey", "Price Paid",
    "open data" and "open licence/license" across all fetched Goodlord artifacts returned
    zero hits.

    The UK's genuinely open property layer sits in the public sector, not with the
    PropTech vendors: HM Land Registry (Price Paid Data, ownership data) and Ordnance
    Survey (addressing and mapping) publish open-licensed data with real APIs. That is
    the UK counterweight to the private Rightmove/Zoopla duopoly, and none of it is
    Goodlord's. The only adjacent public-data touchpoint found is a partner, not a
    publication: Goodlord's partners page describes Perse as providing "access to energy
    and carbon data for all buildings and vehicles in Britain; data which helps drive
    Goodlord's energy notification service" — Goodlord consumes that, it does not publish
    it. Kamma is likewise consumed for property licensing intelligence across "over 370
    selective, additional and HMO licensing schemes".

authModel:
  referencingApi:
    scheme: OAuth 2.0 client_credentials (machine-to-machine)
    tokenEndpointSandbox: https://api-sandbox.goodlord.co/auth/token
    tokenEndpointLive: https://api.goodoverlord.com/auth/token
    grantType: client_credentials
    credentials: client_id and client_secret, posted as JSON
    tokenFormat: JWT
    tokenType: Bearer
    tokenLifetimeSeconds: 3600
    additionalRequiredHeader: 'Company-ID: <issued Company ID> on every request'
    observedScopeString: 'free_plan referencing_product (from the example token response
      in Goodlord''s own published authentication documentation)'
    declaredScopesInSpec: 'empty — components.securitySchemes.OAuth2.flows.clientCredentials.scopes
      is {} in both the live and sandbox OpenAPI documents'
    openidConnect: false
    source: OpenAPI 3.1.0 securitySchemes plus the Authentication section of
      https://portal.goodlord.co/portal/catalogue-products/referencing-product-1
  insuranceAppApi:
    scheme: JWT bearer in the Authorization header
    securitySchemeType: 'apiKey (in header, name Authorization) — declared as type apiKey
      rather than http/bearer in the published spec'
