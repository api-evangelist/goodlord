name: Goodlord
kind: company
description: >-
  Goodlord (Oh Goodlord Limited, London) is a United Kingdom PropTech platform that
  digitises the pre-tenancy and tenancy lifecycle for residential letting agents,
  landlords and tenants — tenant referencing, e-signed tenancy contracts, rent and
  deposit payments, rent protection insurance, guarantors, PEPs and sanctions checks,
  inventories, utility switching and end-of-tenancy. It sits in the middle of the UK
  rental value chain, between the agency CRM (Reapit, Alto, Street, Qube) and the
  regulated deposit schemes, insurers and utility suppliers, rather than on the
  listings side controlled by the Rightmove/Zoopla portal duopoly. Its API posture is
  unusually open for the UK sector but is honestly split in two — the documentation is
  genuinely public and the machine-readable contracts are downloadable without a login
  from a Tyk-powered developer portal at portal.goodlord.co, yet credentials are not
  self-serve: the portal's own registration page returns "Registration is not allowed"
  and requires an invite code, and Goodlord's own getting-started guide instructs
  developers to obtain sandbox and production access through a Goodlord sales manager
  or account manager. Public contract, partner-gated keys. There is no RESO reference
  of any kind — RESO is a US NAR/MLS construct with no United Kingdom counterpart — and
  Goodlord publishes no open data.
