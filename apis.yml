apis:
- aid: goodlord:goodlord-referencing-api
  name: Goodlord Referencing API
  description: >-
    Goodlord's public Referencing API — the production surface of the Referencing
    Product listed in the public catalogue of the Goodlord Developer Portal. It lets a
    lettings agency's own system create rental applications, add and assess Applicants
    and Guarantors (plus Employer, Accountant and Landlord referees) through the
    referencing process, patch outcome conditions, read touchpoints and emails, and
    retrieve generated documents. Authentication is OAuth 2.0 machine-to-machine
    client_credentials against /auth/token, returning a one-hour JWT bearer token; every
    call additionally carries an issued Company-ID header. Three webhook events are
    documented (V2.subject.report.generated, V2.subject.reference.form.generated,
    V2.subject.outcome.updated) but subscriptions are configured by Goodlord on request,
    not self-serve. The OpenAPI 3.1.0 document was fetched anonymously; credentials are
    issued only through a Goodlord account manager.
  humanURL: https://portal.goodlord.co/portal/catalogue-products/referencing-product-1
  baseURL: https://api.goodoverlord.com
