- aid: goodlord:goodlord-referencing-api-sandbox
  name: Goodlord Referencing API (Sandbox)
  description: >-
    The sandbox environment of the Goodlord Referencing Product, published as a separate
    entry in the developer portal's public catalogue and carrying its own OpenAPI 3.1.0
    document with the sandbox server and sandbox token endpoint. Operation surface is
    identical to the live API. Goodlord's getting-started guide states that a sandbox
    account is arranged by Goodlord's team during a commercial engagement and that
    production is enabled afterwards by an account manager, so this is a partner sandbox
    rather than an open trial — no self-serve key issuance exists.
  humanURL: https://portal.goodlord.co/portal/catalogue-products/referencing-product-1
  baseURL: https://api-sandbox.goodlord.co
  tags:
