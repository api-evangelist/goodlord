- aid: goodlord:goodlord-insurance-app-api
  name: Goodlord Insurance App API
  description: >-
    A second real Goodlord API surface, discovered outside the developer portal. The
    Goodlord Insurance App is an API Platform (Symfony) service whose OpenAPI 3.1.0
    document is served publicly and unauthenticated at /api/v1/docs with the
    application/vnd.openapi+json media type. It covers rent protection insurance claims
    handling — insurance claims and claim submission, claim file upload and deletion,
    claim payments, rent schedules and rent schedule rows, plus agents, companies, roles
    and role groups. All 21 operations are gated by a JWT in the Authorization header and
    every collection probe returned HTTP 401. Goodlord does not list this API in its
    developer portal catalogue and publishes no onboarding path for it, so the contract
    is public but the API itself is an internal application surface, not an offered
    developer product.
  humanURL: https://insurance-app.goodlord.co/api/v1/docs
  baseURL: https://insurance-app.goodlord.co
  tags:
  - Insurance
