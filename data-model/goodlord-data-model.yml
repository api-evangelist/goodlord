observations:
- The Referencing API declares 12 schemas for 15 operations; the Insurance App declares 96 schema
  variants for 35 operations, but most are API Platform serialisation-group projections of the same
  11 entities (.jsonapi, .csv, .jsonMergePatch and -<group>.read suffixes), not distinct types.
- No entity in either API is shared with the other. Goodlord's referencing identifiers do not appear
  in the claims contract and vice versa.
- Payments and Companies are read-only over the Insurance App API; only claims, files, rent schedule
  rows, agents, roles and role groups accept writes.
