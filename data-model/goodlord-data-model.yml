entities:
- name: Application
  domain: Referencing
  schema: openapi/goodlord-referencing-api-openapi.json#/components/schemas/Application
  description: >-
    A rental application. Carries the tenancy/rental information and the set of Subjects
    (applicants, guarantors and their referees) being assessed for that tenancy.
  fields: [id, tenancy, subjects, agency, createdAt]
  identifier: id
  operations: [createApplication, getApplication, patchApplication, deleteApplication]
- name: Subject
  domain: Referencing
  schema: openapi/goodlord-referencing-api-openapi.json#/components/schemas/Subject
  description: >-
    A person assessed within an Application. The published type set is Applicant, Guarantor,
    Employer referee, Accountant referee and Landlord referee. Carries rentalDetails
    (price share, affordability ratio), context, outcome, milestones, recommendations and
    attachedSubjects (the referees hung off an applicant or guarantor).
  fields: [id, externalId, type, rentalDetails, context, outcome, attachedSubjects, milestones, recommendations]
  identifier: id
  external_identifier: externalId
  operations: [createSubject, getSubject, patchSubject, deleteSubject, patchSubjectOutcomeConditions]
- name: Touchpoint
  domain: Referencing
  schema: openapi/goodlord-referencing-api-openapi.json#/components/schemas/APITouchpoint
  description: An audit/communication event recorded against a Subject during referencing.
  fields: [id, subjectId, category, author, message, createdAt]
  identifier: id
  operations: [getSubjectTouchpoints]
- name: Email
  domain: Referencing
  schema: openapi/goodlord-referencing-api-openapi.json#/components/schemas/APIEmail
