note: >-
  Entity-relationship graph derived mechanically from the schema objects and id-reference
  fields declared in Goodlord's two published OpenAPI 3.1.0 documents, plus the prose domain
  model published in the developer portal ("an Application contains rental information and all
  of the applicants/guarantors which are applying for a tenancy"). Goodlord publishes no object
  reference with id prefixes, so no prefix column is asserted. The Referencing and Insurance App
  surfaces are two separate services that share no identifier space in the published contracts —
  the only observable seam is the free-text/boolean claim fields on InsuranceClaim
  (referencingCompletedByGoodlord, isTenancyCreatedOnGoodlord, depositCollectedByGoodlord),
  which record whether the underlying tenancy was handled on the Goodlord platform. That is a
  reporting flag, not a foreign key.
