  /referencing/subject/{subjectId}/touchpoints:
    get:
      externalDocs:
        description: Find out more about Subjects
        url: https://portal.goodlord.co/blog/2024/8/20/getting-started-with-goodlord-referencing-api#subjects
      tags:
      - Subject
      summary: Get Subject Touchpoints
      description: Retrieve all touchpoints for a subject, including communications and interactions
      operationId: getSubjectTouchpoints
      parameters:
      - name: subjectId
        in: path
        description: SubjectId you wish to retrieve touchpoints for
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/APITouchpoint'
              examples:
                Example 1 - System touchpoints:
                  value:
                  - id: 78230093-8035-4aad-81db-9221cd5019a0
                    subjectId: a6770136-63f0-4315-9d9e-3700329a4b91
                    category: residential
                    author:
                      type: system
                    message: We're awaiting additional information from applicant.
                    createdAt: '2024-10-01T14:35:12.189Z'
