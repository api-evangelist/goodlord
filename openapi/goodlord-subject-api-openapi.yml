components:
  schemas:
    PatchSubjectRequest:
      title: Patch Subject Request
      type: object
      description: Supply only the properties you wish to change. The `context` block is required and must include at least one property; `rentalDetails` is optional.
      required:
      - context
      properties:
        context:
          type: object
          description: Subject context fields to update. Omitted fields remain unchanged. Must include at least one property.
          minProperties: 1
          properties:
            email:
              type: string
              description: The new email address you would like to change the subject to have
              example: john@smith.com
            product:
              type: string
              description: The product you wish to change the subject to have. Must be one of `Pro`, `Essential`, or `Priority`. PATCH only supports tier upgrades (e.g. Essential -> Pro -> Priority); switching to/from Corporate or None is not supported via PATCH and requires a new subject.
              enum:
              - Pro
              - Essential
              - Priority
              example: Pro
            mobile:
              type: string
              description: The new mobile you would like to change the subject to have
              example: 07123456789
            firstName:
              type: string
              description: The new first name you would like to change the subject to have
              example: Simon
            lastName:
              type: string
              description: The new last name you would like to change the subject to have
              example: Shaw
            guarantorCollection:
              type: object
              nullable: true
              description: 'Update the guarantor collection configuration on an applicant. Omit from context to leave unchanged. Supply with `required: true` to add or update the requirement (creates a recommendation and sends a ''guarantor required'' email when transitioning to true); supply with `required: false` to mark as not-required (expires active guarantor recommendations); or supply `null` to remove the guarantorCollection from the subject entirely. Only meaningful on subjects with `type: applicant`. Note: changes to `product` or `affordabilityRatio` alone (without a change in `required`) do not re-trigger the workflow.'
              required:
              - required
              - product
              - affordabilityRatio
              properties:
                required:
                  type: boolean
                  description: Whether a guarantor is required for this applicant.
                  example: true
                product:
                  type: string
                  description: The referencing product the guarantor will go through.
                  enum:
                  - Pro
                  - Essential
                  - Priority
                  - Corporate
                  example: Pro
                affordabilityRatio:
                  type: number
                  minimum: 1
                  description: 'Minimum income-to-rent multiplier the guarantor''s income must satisfy. Must be >= 1. Note: API consumers always operate within a company that has a pre-configured `GuarantorAffordabilityRatio`, so the value supplied here will be silently replaced by the company-configured value before storage.'
                  example: 3.0
        rentalDetails:
          type: object
          description: Update the subject's rental details. Omitted fields remain unchanged.
          properties:
            priceShare:
              type: number
              exclusiveMinimum: 0
              description: The new monthly rent share for this subject, in GBP. Must be > 0 and <= the application's monthly cost.
              example: 1000
            affordabilityRatio:
              type: number
              minimum: 1
              description: 'New minimum income-to-rent multiplier. Must be >= 1. Note: API consumers always operate within a company that has a pre-configured affordability ratio (`TenantAffordabilityRatio` for applicants, `GuarantorAffordabilityRatio` for guarantors), so the value supplied here will be silently replaced by the company-configured value before storage. The PATCH still returns 200, but the stored ratio will snap back to the company-configured value.'
              example: 3.0
    APITouchpoint:
      title: API Touchpoint
      type: object
      description: A touchpoint represents a communication or interaction point for a subject.
      properties:
        id:
          type: string
          example: '12345'
        subjectId:
          type: string
          example: a6770136-63f0-4315-9d9e-3700329a4b91
        category:
          type: string
          example: email
        author:
          $ref: '#/components/schemas/APITouchpointAuthor'
        message:
          type: string
          example: Application has been received and is being processed
        createdAt:
          type: string
          format: date-time
          description: The date and time the touchpoint was created, in ISO 8601 format. All timestamps are in UTC (indicated by the Z suffix).
          example: '2024-10-01T14:35:12.189Z'
      required:
      - id
      - subjectId
      - category
      - author
      - message
      - createdAt
    CreateSubjectRequest:
      title: Create Subject Request
      type: object
      required:
      - rentalDetails
      - context
      - type
      - attachedSubjects
      properties:
        externalId:
          type: string
        rentalDetails:
          type: object
          required:
          - priceShare
          properties:
            priceShare:
              type: number
              description: The portion of the monthly rent attributed to this subject, in GBP. For sole tenants this equals the property's monthly rent; for shared tenancies it is the per-tenant share.
            affordabilityRatio:
              type: number
              minimum: 1
              description: 'Minimum income-to-rent multiplier the subject''s income must satisfy. Typical values: 2.5 for applicants, 3.0 for guarantors. Must be >= 1. Note: API consumers always operate within a company that has a pre-configured affordability ratio (`TenantAffordabilityRatio` for applicants, `GuarantorAffordabilityRatio` for guarantors), so the value supplied here will be silently replaced by the company-configured value before storage. The request still returns 200, but the stored value is the company-configured one and is what subsequent GETs will return. To confirm or change your company''s configured value, contact your Goodlord account manager.'
        context:
          type: object
          required:
          - firstName
          - lastName
          - email
          - product
          properties:
            firstName:
              type: string
            lastName:
              type: string
            email:
              type: string
            mobile:
              type: string
            redirectUrlOnJourneyComplete:
              type: string
            tenancyRenewal:
              type: boolean
            product:
              type: string
              enum:
              - Pro
              - Essential
              - Priority
              - Corporate
              - None
            idvt:
              type: string
              enum:
              - Required
              - NotRequired
              description: Whether IDVT (Identity document validation technolgy) is Required to be used against the subjects provided documents
              default: NotRequired
              example: NotRequired
            pepSanctions:
              type: string
              enum:
              - Required
              - NotRequired
              description: Whether PEP and Sanction checks will be run against the subject
              default: NotRequired
              example: NotRequired
            communicationPreferences:
              type: object
              properties:
                sendInitialTenantEmail:
                  type: boolean
                  example: false
                  description: Whether to send the initial tenant email. This is used to notify the tenant that they have been added to a referencing application. You may wish to disable this if you wish to send your own emails rather than relying on Goodlord to send them. Please note that this email does include a link to the referencing bot journey that an applicant is required to fill out to submit their application.
                disableRentProtectionComms:
                  type: boolean
                  example: true
                  description: Whether to show Rent Protection Insurance (RPI) copy & coverage in the subject referencing PDF report
                disableTCLIComms:
                  type: boolean
                  example: true
                  description: Whether to show Tenant Contents and Liability Insurance (TCLI) banner in subject referencing PDF report
                disableTenancyServicesComms:
                  type: boolean
                  example: true
                  description: Whether to show tenancy services banner in subject referencing PDF report
            company:
              examples:
              - null
              description: Company information, only required when ProductType is Corporate
              type: object
              nullable: true
              properties:
                name:
                  type: string
                  description: The name of the company to be referenced for the Corporate Let
                  example: Acme Corporation
                companyNumber:
                  type: string
                  description: The company number of the company to be referenced for the Corporate Let
                  example: '12345678'
              required:
              - name
            guarantorCollection:
              type: object
              nullable: true
              description: 'Indicates that this applicant requires a guarantor. When `required` is `true`, Goodlord will trigger guarantor collection workflows: a recommendation is created on the applicant and a ''guarantor required'' email is sent. The actual guarantor subject is created later, either by the tenant via the bot journey or by you via a follow-up Create Subject call. Only valid on subjects with `type: applicant` - supplying this on a guarantor subject will return a 400 with error code `GuarantorCollectionInvalidSubjectType`.'
              required:
              - required
              - product
              - affordabilityRatio
              properties:
                required:
                  type: boolean
                  description: Whether a guarantor is required for this applicant. Set to `true` to trigger guarantor collection workflows. When `false`, the other fields are still validated against their schema but no recommendation or email is generated.
                  example: true
                product:
                  type: string
                  description: The referencing product the guarantor will go through when they begin their journey.
                  enum:
                  - Pro
                  - Essential
                  - Priority
                  - Corporate
                  example: Pro
                affordabilityRatio:
                  type: number
                  minimum: 1
                  description: 'Minimum income-to-rent multiplier the guarantor''s income must satisfy. Typically 3.0 (guarantors are usually held to a higher standard than the tenant). Must be >= 1. Note: API consumers always operate within a company that has a pre-configured `GuarantorAffordabilityRatio`, so the value supplied here will be silently replaced by the company-configured value before storage. The request still returns 200, but the stored value is the company-configured one and is what subsequent GETs will return. To confirm or change your company''s configured value, contact your Goodlord account manager.'
                  example: 3.0
        type:
          type: string
          enum:
          - applicant
          - guarantor
          - supplementary
        attachedSubjects:
          type: array
          items:
            type: object
            required:
            - id
            - type
            properties:
              id:
                type: string
              type:
                type: string
    Subject:
      title: Subject
      type: object
      description: A subject is a person who is part of an application.
      properties:
        externalId:
          type: string
          example: '1234'
        rentalDetails:
          type: object
          properties:
            priceShare:
              type: number
              description: The portion of the monthly rent attributed to this subject, in GBP.
              example: 1000
            affordabilityRatio:
              type: number
              description: 'Minimum income-to-rent multiplier the subject''s income must satisfy. The stored value reflects company-config precedence: if your company has a configured affordability ratio (`TenantAffordabilityRatio` for applicants, `GuarantorAffordabilityRatio` for guarantors), the response shows that value rather than any value originally supplied at creation/patch time.'
              example: 2.5
        context:
          type: object
          properties:
            name:
              type: string
              example: John Smith
            firstName:
              type: string
              example: John
            lastName:
              type: string
              example: Smith
            email:
              type: string
              example: john@smith.com
            mobile:
              type: string
              example: 07912345678
            redirectUrlOnJourneyComplete:
              type: string
              example: https://www.myapp.com/complete
            tenancyRenewal:
              type: boolean
              example: false
            product:
              type: string
              example: Pro
            addresses:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    example: '1234'
                  addressType:
                    type: string
                    example: current
                  bedroomIdentifier:
                    type: string
                    example: Room A
                  name:
                    type: string
                    example: '22'
                  startDate:
                    type: string
                    example: '2024-10-01'
                  status:
                    type: string
                    example: Renting
                  line1:
                    type: string
                    example: Street
                  normalizedLine1:
                    type: string
                    example: 22 Street
                  line2:
                    type: string
                    example: Crookesmoore
                  city:
                    type: string
                    example: Sheffield
                  county: {}
                  postcode:
                    type: string
                    example: S1 123
                  country:
                    type: string
                    example: England
                  countryCodeAlpha2:
                    type: string
                    example: GB
                  referee:
                    type: object
                    properties:
                      id:
                        type: string
                        example: '1234'
                      name:
                        type: string
                        example: Jane Smith
                      email:
                        type: string
                        example: jane@smith.com
                      mobile:
                        type: string
                        example: 07912345678
                      createdAt:
                        type: string
                        example: '2024-10-01'
            incomes:
              type: array
              items:
                type: object
                properties:
                  company:
                    type: string
                    example: Tesco
                  position:
                    type: string
                    example: Manager
                  contractType:
                    type: string
                    example: Permanent
                  contractSchedule:
                    type: string
                    example: Full Time
                  guaranteedBonus: {}
                  startDate:
                    type: string
                    example: '2024-10-01'
                  endDate: {}
                  address:
                    type: object
                    properties:
                      id: {}
                      addressType:
                        type: string
                      name: {}
                      startDate: {}
                      status: {}
                      line1:
                        type: string
                      normalizedLine1:
                        type: string
                      line2:
                        type: string
                      line3: {}
                      city:
                        type: string
                      county: {}
                      postcode:
                        type: string
                      country:
                        type: string
                      countryCodeAlpha2: {}
                  referee:
                    type: object
                    properties:
                      id:
                        type: string
                        example: '1234'
                      name:
                        type: string
                        example: Jane Smith
                      email:
                        type: string
                        example: jane@smith.com
                      mobile:
                        type: string
                        example: 07912345678
                      createdAt:
                        type: string
                        example: '2024-10-01'
                      isNonProfessionalEmail:
                        type: boolean
                        nullable: true
                        description: True when the referee's email domain has been flagged as a free or non-professional email provider (e.g. gmail.com, yahoo.com). Null when the value cannot be determined or is not evaluated for this referee type.
                        example: true
                  type:
                    type: string
                  evidenceType:
                    type: string
                    example: Open Banking
                  income:
                    type: object
                    properties:
                      value:
                        type: number
                      currency:
                        type: string
                      frequency:
                        type: string
                  id:
                    type: string
            incomeSummary:
              type: object
              properties:
                totalIncome:
                  type: number
                  example: 2000
                totalVerifiedIncome:
                  type: number
                  example: 1000
                maximumAffordabilityPercentage:
                  type: number
                  example: 123
                openBanking:
                  type: object
                  properties:
                    provider:
                      type: string
                      example: tink
                    status:
                      type: string
                      example: Connected
                    outcome:
                      type: object
                      properties:
                        estimatedAnnualNetIncome:
                          type: number
                          example: 1000
                        estimatedAnnualGrossIncome:
                          type: number
                          example: 1500
                    optOutReason:
                      type: object
                      properties:
                        category:
                          type: string
                          example: bankNotListed
                          enum:
                          - bankNotListed
                          - connectionFailed
                          - privacyConcerns
                          - incomeAccuracy
                          - somethingElse
                          - userOptedOut
                        additionalInformation:
                          type: string
                          example: Additional information here.
            credit:
              type: object
              properties:
                hasAdverseCredit:
                  type: boolean
                  example: false
                adverseCreditDeclared:
                  type: boolean
                  example: false
            documents:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    example: '1234'
                  fileName:
                    type: string
                    example: file.pdf
                  thumbnail:
                    type: string
                    example: file.png
                  documentType:
                    type: string
                    example: Proof of Address
            communicationPreferences:
              type: object
              properties:
                sendInitialTenantEmail:
                  type: boolean
                  example: false
                  description: Whether to send the initial tenant email. This is used to notify the tenant that they have been added to a referencing application. You may wish to disable this if you wish to send your own emails rather than relying on Goodlord to send them. Please note that this email does include a link to the referencing bot journey that an applicant is required to fill out to submit their application.
                disableRentProtectionComms:
                  type: boolean
                  example: true
                  description: Whether to show Rent Protection Insurance (RPI) copy & coverage in the subject referencing PDF report
                disableTCLIComms:
                  type: boolean
                  example: true
                  description: Whether to show Tenant Contents and Liability Insurance (TCLI) banner in subject referencing PDF report
                disableTenancyServicesComms:
                  type: boolean
                  example: true
                  description: Whether to show tenancy services banner in subject referencing PDF report
            guarantorCollection:
              type: object
              nullable: true
              description: Reflects the guarantor collection configuration on this subject. Only populated when present on the stored subject - applicants with a guarantor requirement will have this populated; applicants without and all guarantors will not. The `affordabilityRatio` shown here reflects the resolved value after company-config precedence is applied.
              properties:
                required:
                  type: boolean
                  description: Whether a guarantor is required for this applicant.
                  example: true
                product:
                  type: string
                  description: The referencing product the guarantor will go through.
                  enum:
                  - Pro
                  - Essential
                  - Priority
                  - Corporate
                  example: Pro
                affordabilityRatio:
                  type: number
                  minimum: 1
                  description: Minimum income-to-rent multiplier the guarantor's income must satisfy. Reflects company-config precedence (see request schema for details).
                  example: 3.0
            identity:
              type: object
              nullable: true
              properties:
                nationality:
                  type: string
                  example: UK
                  description: The tenant's nationality
                nationalInsuranceNumber:
                  type: string
                  example: AB123456C
                  description: The tenant's National Insurance Number
                r2rShareCode:
                  type: string
                  example: A12 B3D EFG
                  description: The tenant's Right to Rent Share Code
                idvt:
                  type: object
                  nullable: true
                  properties:
                    idCheckStatus:
                      type: string
                      enum:
                      - Pending
                      - Pass
                      - Fail
                      - Refer
                    r2rCheckStatus:
                      type: string
                      enum:
                      - NotPerformed
                      - Pending
                      - Pass
                      - Fail
                      - Refer
                pepsSanctions:
                  type: object
                  nullable: true
                  properties:
                    pepsStatus:
                      type: string
                      enum:
                      - NotFound
                      - Match
                      - ActionRequired
                    sanctionsStatus:
                      type: string
                      enum:
                      - NotFound
                      - Match
                      - ActionRequired
        outcome:
          type: object
          properties:
            status:
              type: string
              example: Accepted
            comments:
              type: string
              example: This application has been accepted
            rpi:
              type: object
              properties:
                eligibility:
                  type: string
                  example: eligible
                comments:
                  type: string
                  example: This application is eligible for RPI
            sections:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                    example: Income
                  status:
                    type: string
                    example: Accepted
        id:
          type: string
          example: '1234'
        type:
          type: string
          enum:
          - applicant
          - guarantor
          example: applicant
        attachedSubjects:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              type:
                type: string
        milestones:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                example: FinalOutcome
              event:
                type: string
                example: subject.accepted
              createdAt:
                type: string
                example: '2024-10-01'
              updatedAt:
                type: string
                example: '2024-10-01'
        recommendations:
          type: array
          items: {}
      required: []
    APITouchpointAuthor:
      title: API Touchpoint Author
      type: object
      description: The author of a touchpoint.
      properties:
        id:
          type: string
          nullable: true
          example: author-123
        type:
          type: string
          example: system
        email:
          type: string
          nullable: true
          example: noreply@goodlord.co
      required:
      - type
    APIEmail:
      type: object
      description: The information about an email sent to an applicant
      properties:
        emailAddress:
          type: string
          nullable: 'true'
          example: test@example.com
        emailSubject:
          type: string
          nullable: 'false'
          example: Start your referencing.
        date:
          type: string
          format: date-time
          description: The date and time the email was sent, in ISO 8601 format. All timestamps are in UTC (indicated by the Z suffix).
          example: '2025-10-01T12:34:56.789Z'
        status:
          type: string
          nullable: 'true'
          description: The delivery status of the email.
          enum:
          - Draft
          - Sent
          - Delivered
          - Failed
          - Opened
          example: Sent
    PatchSubjectOutcomeConditionsRequest:
      title: Patch Subject Outcome Conditions Request
      type: object
      description: Patch a subject's outcome conditions
      properties:
        conditions:
          type: object
          description: Dictionary mapping condition type to confirmation status. Valid keys are `confirmedIdOnPerson` and `confirmedProofOfAddress`.
          properties:
            confirmedIdOnPerson:
              type: boolean
              description: Whether the individual's ID has been confirmed in person.
            confirmedProofOfAddress:
              type: boolean
              description: Whether proof of address has been confirmed.
          example:
            confirmedProofOfAddress: true
        requestedBy:
          type: string
          example: User123
          description: Identifier of the user or system that made the confirmation request.
      required:
      - conditions
      - requestedBy
    APIErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              reason:
                type: string
                example: PropertyIsInvalid
              description:
                type: string
                example: Request.Property is Invalid
            required:
            - reason
            - description
      required:
      - errors
  parameters:
    CompanyId:
      name: Company-ID
      in: header
      description: A unique GUID identifying your company, issued alongside your API keys. This value may differ between production and sandbox environments. This is a mandatory header for all application and subject endpoints.
      required: true
      schema:
