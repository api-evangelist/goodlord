components:
  schemas:
    JsonApiCollectionBaseSchema:
      allOf:
      - $ref: '#/components/schemas/JsonApiCollectionBaseSchemaNoPagination'
      - type: object
        properties:
          links:
            type: object
            properties:
              first:
                type: string
                format: iri-reference
              prev:
                type: string
                format: iri-reference
              next:
                type: string
                format: iri-reference
              last:
                type: string
                format: iri-reference
            example:
              first: string
              prev: string
              next: string
              last: string
          meta:
            type: object
            properties:
              itemsPerPage:
                type: integer
                minimum: 0
              currentPage:
                type: integer
                minimum: 0
    JsonApiCollectionBaseSchemaNoPagination:
      type: object
      properties:
        links:
          type: object
          properties:
            self:
              type: string
              format: iri-reference
          example:
            self: string
        meta:
          type: object
          properties:
            totalItems:
              type: integer
              minimum: 0
        data:
          type: array
      required:
      - data
    RoleGroup.jsonMergePatch:
      type: object
      properties:
        name:
          type: string
        roles:
          type: array
          items:
            type: string
            format: iri-reference
            example: https://example.com/
        id:
          readOnly: true
          type: string
          format: uuid
        deletedAt:
          type:
          - string
          - 'null'
          format: date-time
        admin:
          readOnly: true
          type: boolean
        agent:
          readOnly: true
          type: boolean
        logContext:
          readOnly: true
          type: array
          items:
            type:
            - string
            - 'null'
        deleted:
          readOnly: true
          description: Check if the entity has been soft deleted.
          type: boolean
    Role.jsonapi:
      properties:
        data:
          type: object
          properties:
            id:
              type: string
            type:
              type: string
            attributes:
              $ref: '#/components/schemas/Role'
            relationships:
              type: object
              properties:
                roleGroups:
                  properties:
                    data:
                      type: array
                      items:
                        type: object
                        properties:
                          type:
                            type: string
                          id:
                            type: string
                            format: iri-reference
          required:
          - type
          - id
        included:
          description: Related resources requested via the "include" query parameter.
          type: array
          items:
            anyOf:
            - $ref: '#/components/schemas/RoleGroup.jsonapi'
          readOnly: true
          externalDocs:
            url: https://jsonapi.org/format/#fetching-includes
    RoleGroup.jsonapi:
      properties:
        data:
          type: object
          properties:
            id:
              type: string
            type:
              type: string
            attributes:
              $ref: '#/components/schemas/RoleGroup'
            relationships:
              type: object
              properties:
                roles:
                  properties:
                    data:
                      type: array
                      items:
                        type: object
                        properties:
                          type:
                            type: string
                          id:
                            type: string
                            format: iri-reference
          required:
          - type
          - id
        included:
          description: Related resources requested via the "include" query parameter.
          type: array
          items:
            anyOf:
            - $ref: '#/components/schemas/Role.jsonapi'
          readOnly: true
          externalDocs:
            url: https://jsonapi.org/format/#fetching-includes
    ConstraintViolation.jsonapi:
      properties:
        data:
          type: object
          properties:
            id:
              type: string
            type:
              type: string
            attributes:
              $ref: '#/components/schemas/ConstraintViolation'
          required:
          - type
          - id
    ConstraintViolation:
      type: object
      description: Unprocessable entity
      properties:
        status:
          default: 422
          type: integer
        detail:
          readOnly: true
          type: string
        type:
          readOnly: true
          type: string
        title:
          readOnly: true
          type:
          - string
          - 'null'
        instance:
          readOnly: true
          type:
          - string
          - 'null'
    RoleGroup:
      type: object
      properties:
        name:
          type: string
        roles:
          type: array
          items:
            type: string
            format: iri-reference
            example: https://example.com/
        id:
          readOnly: true
          type: string
          format: uuid
        deletedAt:
          type:
          - string
          - 'null'
          format: date-time
        admin:
          readOnly: true
          type: boolean
        agent:
          readOnly: true
          type: boolean
        logContext:
          readOnly: true
          type: array
          items:
            type:
            - string
            - 'null'
        deleted:
          readOnly: true
          description: Check if the entity has been soft deleted.
          type: boolean
    Error.jsonapi:
      properties:
        errors:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/Error'
            - type: object
              properties:
                source:
                  type: object
                status:
                  type: string
    RoleGroup.csv:
      type: object
      properties:
        name:
          type: string
        roles:
          type: array
          items:
            type: string
            format: iri-reference
            example: https://example.com/
        id:
          readOnly: true
          type: string
          format: uuid
        deletedAt:
          type:
          - string
          - 'null'
          format: date-time
        admin:
          readOnly: true
          type: boolean
        agent:
          readOnly: true
          type: boolean
        logContext:
          readOnly: true
          type: array
          items:
            type:
            - string
            - 'null'
        deleted:
          readOnly: true
          description: Check if the entity has been soft deleted.
          type: boolean
    Role:
      type: object
      required:
      - name
      properties:
        name:
          pattern: ^(ROLE_[A-Z_]+)$
          type: string
        roleGroups:
          type: array
          items:
            type: string
            format: iri-reference
            example: https://example.com/
        id:
          readOnly: true
          type: string
          format: uuid
        deletedAt:
          type:
          - string
          - 'null'
          format: date-time
        logContext:
          readOnly: true
          type: array
          items:
            type:
            - string
            - 'null'
        deleted:
          readOnly: true
          description: Check if the entity has been soft deleted.
          type: boolean
    Error:
      type: object
      description: A representation of common errors.
      properties:
        id:
          type:
          - string
          - 'null'
        title:
          readOnly: true
          description: A short, human-readable summary of the problem.
          type:
          - string
          - 'null'
        detail:
          readOnly: true
          description: A human-readable explanation specific to this occurrence of the problem.
          type:
          - string
          - 'null'
        status:
          type:
          - number
          - 'null'
          examples:
          - 404
          default: 400
        instance:
          readOnly: true
          description: A URI reference that identifies the specific occurrence of the problem. It may or may not yield further information if dereferenced.
          type:
          - string
          - 'null'
        type:
          readOnly: true
          description: A URI reference that identifies the problem type
          type: string
        meta:
          type: object
        source:
          type: object
          properties:
            pointer:
              type: string
            parameter:
              type: string
            header:
              type: string
  securitySchemes:
    JWT:
      type: apiKey
      description: Value for the Authorization header parameter.
      name: Authorization
      in: header
