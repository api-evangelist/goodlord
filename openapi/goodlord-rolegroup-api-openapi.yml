            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          links: {}
        '404':
          description: Not found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Error.jsonapi'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          links: {}
      summary: Retrieves a RoleGroup resource.
      description: Retrieves a RoleGroup resource.
      parameters:
      - name: id
        in: path
        description: RoleGroup identifier
        required: true
        deprecated: false
        schema:
          type: string
        style: simple
        explode: false
    delete:
      operationId: api_role_groups_id_delete
      tags:
      - RoleGroup
      responses:
        '204':
          description: RoleGroup resource deleted
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Error.jsonapi'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          links: {}
        '404':
          description: Not found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Error.jsonapi'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          links: {}
      summary: Removes the RoleGroup resource.
      description: Removes the RoleGroup resource.
      parameters:
      - name: id
        in: path
        description: RoleGroup identifier
        required: true
        deprecated: false
        schema:
          type: string
        style: simple
        explode: false
    patch:
      operationId: api_role_groups_id_patch
      tags:
