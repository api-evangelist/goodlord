            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          links: {}
      summary: Retrieves the collection of RoleGroup resources.
      description: Retrieves the collection of RoleGroup resources.
      parameters:
      - name: page
        in: query
        description: The collection page number
        required: false
        deprecated: false
        schema:
          type: integer
          default: 1
        style: form
        explode: false
      - name: itemsPerPage
        in: query
        description: The number of items per page
        required: false
        deprecated: false
        schema:
          type: integer
          default: 50
          minimum: 0
          maximum: 100
        style: form
        explode: false
    post:
      operationId: api_role_groups_post
      tags:
      - RoleGroup
      responses:
        '201':
          description: RoleGroup resource created
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/RoleGroup.jsonapi'
            application/json:
              schema:
                $ref: '#/components/schemas/RoleGroup'
            text/csv:
              schema:
                $ref: '#/components/schemas/RoleGroup.csv'
          links: {}
        '400':
          description: Invalid input
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Error.jsonapi'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          links: {}
        '422':
          description: An error occurred
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ConstraintViolation.jsonapi'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConstraintViolation'
            application/json:
              schema:
                $ref: '#/components/schemas/ConstraintViolation'
          links: {}
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Error.jsonapi'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          links: {}
      summary: Creates a RoleGroup resource.
      description: Creates a RoleGroup resource.
      parameters: []
      requestBody:
        description: The new RoleGroup resource
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/RoleGroup.jsonapi'
          application/json:
            schema:
              $ref: '#/components/schemas/RoleGroup'
          text/csv:
            schema:
              $ref: '#/components/schemas/RoleGroup.csv'
        required: true
  /api/v1/role_groups/{id}:
    get:
      operationId: api_role_groups_id_get
      tags:
      - RoleGroup
      responses:
        '200':
          description: RoleGroup resource
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/RoleGroup.jsonapi'
            application/json:
              schema:
                $ref: '#/components/schemas/RoleGroup'
            text/csv:
