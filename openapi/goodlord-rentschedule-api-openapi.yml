            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          links: {}
      summary: Creates a RentSchedule resource.
      description: Creates a RentSchedule resource.
      parameters:
      - name: insuranceClaimId
        in: path
        description: RentSchedule identifier
        required: true
        deprecated: false
        schema:
          type: string
        style: simple
        explode: false
      - name: rentScheduleId
        in: path
        description: RentSchedule identifier
        required: true
        deprecated: false
        schema:
          type: string
        style: simple
        explode: false
      requestBody:
        description: The new RentSchedule resource
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/RentSchedule.jsonapi'
          application/json:
            schema:
