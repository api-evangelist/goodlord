        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Error.jsonapi'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          links: {}
        '404':
          description: Not found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Error.jsonapi'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          links: {}
      summary: Retrieves a RentSchedule resource.
      description: Retrieves a RentSchedule resource.
      parameters:
      - name: insuranceClaimId
        in: path
        description: RentSchedule identifier
        required: true
        deprecated: false
        schema:
          type: string
        style: simple
        explode: false
      - name: include
        in: query
        description: Which relations to include in the response
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
        example: rentScheduleRows
  /api/v1/insurance_claims/{insuranceClaimId}/rent_schedule/{rentScheduleId}/rent_schedule_rows:
    post:
      operationId: api_insurance_claims_insuranceClaimIdrent_schedule_rentScheduleIdrent_schedule_rows_post
      tags:
      - RentSchedule
      responses:
        '204':
          description: RentScheduleRowBulk resource created
          links: {}
        '400':
          description: Invalid input
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Error.jsonapi'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          links: {}
        '422':
          description: An error occurred
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ConstraintViolation.jsonapi'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConstraintViolation'
            application/json:
              schema:
                $ref: '#/components/schemas/ConstraintViolation'
          links: {}
      summary: Create multiple rent schedule rows
      description: Creates a RentScheduleRowBulk resource.
      parameters:
      - name: insuranceClaimId
        in: path
        description: RentScheduleRowBulk identifier
        required: true
        deprecated: false
        schema:
          type: string
        style: simple
        explode: false
      - name: rentScheduleId
        in: path
        description: RentScheduleRowBulk identifier
        required: true
        deprecated: false
        schema:
          type: string
        style: simple
        explode: false
      requestBody:
        description: At least one row; each item matches single-row POST payload (see schema).
        content:
          application/vnd.api+json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  required:
                  - attributes
                  properties:
                    type:
                      type: string
                      example: RentScheduleRowBulk
                    attributes:
                      type: object
                      required:
                      - rentScheduleRows
                      properties:
                        rentScheduleRows:
                          type: array
                          minItems: 1
                          items:
                            type: object
                            required:
                            - rowType
                            - date
                            - amount
                            properties:
                              rowType:
                                type: string
                                enum:
                                - tenant_payment
                                - rent_due
                              date:
                                type: string
                                format: date
                              amount:
                                type: object
                                required:
                                - amount
                                - currency
                                properties:
                                  amount:
                                    type: integer
                                    description: Amount in minor units (e.g. pence)
                                  currency:
                                    type: string
                                    example: GBP
                              note:
                                type: string
                                nullable: true
            example:
              data:
                type: RentScheduleRowBulk
                attributes:
                  rentScheduleRows:
                  - rowType: tenant_payment
                    date: '2024-01-15'
                    amount:
                      amount: 150000
                      currency: GBP
                    note: First row
                  - rowType: rent_due
                    date: '2024-02-15'
                    amount:
                      amount: 160000
                      currency: GBP
        required: true
  /api/v1/insurance_claims/{insuranceClaimId}/rent_schedule/{rentScheduleId}/submit:
    post:
      operationId: api_insurance_claims_insuranceClaimIdrent_schedule_rentScheduleIdsubmit_post
