note: >-
  Goodlord publishes no scopes or permissions reference page. The OpenAPI declares an OAuth 2.0
  clientCredentials flow with an EMPTY scopes object in both the live and sandbox documents, so
  a client cannot discover any scope from the contract. The two scopes below are taken verbatim
  from the example token response Goodlord publishes in its own Authentication walkthrough,
  where the granted scope string is "free_plan referencing_product". They are observed at
  runtime, not declared — nothing else is asserted about them, and no request-time scope
  parameter is documented.
