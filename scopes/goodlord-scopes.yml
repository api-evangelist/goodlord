scopes:
- scope: free_plan
  description: >-
    Observed in the granted scope string of the documented example token response. Reads as a
    plan/entitlement marker rather than a resource permission. Goodlord publishes no
    definition, and no other plan value has been observed.
  flows: [clientCredentials]
  observed_at_runtime: true
  declared_in_spec: false
  sources: [https://portal.goodlord.co/portal/catalogue-products/referencing-product-1]
- scope: referencing_product
  description: >-
    Observed in the granted scope string of the documented example token response. Grants
    access to the Referencing product surface. Product-level rather than operation-level —
    no read/write or per-resource split is published.
  flows: [clientCredentials]
  observed_at_runtime: true
  declared_in_spec: false
  sources: [https://portal.goodlord.co/portal/catalogue-products/referencing-product-1]
tenant_scoping:
  mechanism: Company-ID request header
  note: >-
    The real access boundary on this API is not the OAuth scope, it is the issued Company-ID
    header carried on every request. Scope selects the product; Company-ID selects the letting
    agency whose data you can see. The header is documented only in the portal and is not
    declared anywhere in the OpenAPI.
